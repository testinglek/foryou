<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Love Mode</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <main class="app">
      <!-- Scene 1: Landing -->
      <section id="scene-landing" class="scene is-active" data-scene="landing" aria-label="Landing Love Mode">
        <div class="card glass" id="landingCard">
          <div class="heartIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="38" height="38" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 21s-7-4.534-9.5-9.05C.5 8.1 2.2 5.5 5.2 5.05c1.7-.25 3.2.45 4.2 1.65 1-1.2 2.5-1.9 4.2-1.65 3 .45 4.7 3.05 2.7 6.9C19 16.466 12 21 12 21Z"
                fill="url(#g)"
              />
              <defs>
                <linearGradient id="g" x1="2" y1="4" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ff3b6a" />
                  <stop offset="1" stop-color="#ff93c4" />
                </linearGradient>
              </defs>
            </svg>
          </div>

          <h1 class="title">Love mode</h1>
          <p class="subtitle">Semoga kamu suka ya.</p>

          <div class="toggleWrap">
            <span class="toggleLabel">OFF</span>
            <label class="toggle" title="Mulai">
              <input id="loveToggle" type="checkbox" />
              <span class="toggleTrack" aria-hidden="true"></span>
              <span class="toggleThumb" aria-hidden="true"></span>
            </label>
            <span class="toggleLabel toggleOn">ON</span>
          </div>

          <div class="hint">Klik toggle untuk mulai.</div>
          <div class="landingGlow" aria-hidden="true"></div>
        </div>
      </section>

      <!-- Scene 2: Mini Game -->
      <section id="scene-miniGame" class="scene" data-scene="miniGame" aria-label="Mini Game Love">
        <div class="panel">
          <div class="miniTop">
            <div class="miniTitle">Let's play a little game...</div>
            <div id="miniStatus" class="miniStatus">Your turn</div>
          </div>

          <div class="grid" id="gameGrid" role="grid" aria-label="Grid permainan 3x3">
            <!-- cells generated by JS -->
          </div>

          <div id="miniResult" class="miniResult" aria-live="polite" hidden>
            <div id="miniResultText" class="miniResultText"></div>
            <div class="miniResultActions" id="miniResultActions"></div>
          </div>

          <div class="miniFooter">
            <span class="miniNote">Cepat saja, jangan baper terlalu lama.</span>
          </div>
        </div>
      </section>

      <!-- Scene 3: Loading Love Intensity -->
      <section id="scene-loading" class="scene" data-scene="loading" aria-label="Love Intensity Loading">
        <div class="panel center">
          <div class="loadingCard glass">
            <div class="loadingTop">
              <div class="loadingHeart" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M12 21s-7-4.534-9.5-9.05C.5 8.1 2.2 5.5 5.2 5.05c1.7-.25 3.2.45 4.2 1.65 1-1.2 2.5-1.9 4.2-1.65 3 .45 4.7 3.05 2.7 6.9C19 16.466 12 21 12 21Z"
                    fill="url(#l)"
                  />
                  <defs>
                    <linearGradient id="l" x1="2" y1="4" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#ff3b6a" />
                      <stop offset="1" stop-color="#ff93c4" />
                    </linearGradient>
                  </defs>
                </svg>
              </div>

              <div class="loadingTitleWrap">
                <div class="loadingTitle">Love Intensity</div>
                <div class="loadingPercent" id="lovePercent">0%</div>
              </div>
            </div>

            <div class="gaugeWrap">
              <svg class="gauge" viewBox="0 0 220 120" aria-hidden="true">
                <path class="gaugeBg" d="M10 110 A100 100 0 0 1 210 110" />
                <path id="gaugeArc" class="gaugeArc" d="M10 110 A100 100 0 0 1 210 110" />
              </svg>
            </div>

            <div class="bar">
              <div class="barInner" id="loveBar"></div>
            </div>

            <div class="loadingHint">Pelan-pelan... sampai penuh.</div>
          </div>
        </div>
      </section>

      <!-- Scene 4: Typing Text -->
      <section id="scene-typing" class="scene" data-scene="typing" aria-label="Typing Text">
        <div class="panel center">
          <div class="typingCard glass">
            <div class="typingKicker">Sebentar ya...</div>
            <div class="typingLine" aria-label="Teks mengetik">
              <span id="typedText" class="typedText"></span><span class="cursor" aria-hidden="true">|</span>
            </div>
            <div class="typingSub">Kamu sabar aku makin sayang hehe</div>
          </div>
        </div>
      </section>

      <!-- Scene 5: Flower Bloom -->
      <section id="scene-flower" class="scene" data-scene="flower" aria-label="Animasi Bunga Mekar">
        <div class="flowerShell">
          <div class="flowerGlow" aria-hidden="true"></div>

          <div class="flowerStage">
            <div class="rose" id="rose" aria-hidden="true">
              <div class="roseCore"></div>
              <span class="rosePetal p1"></span>
              <span class="rosePetal p2"></span>
              <span class="rosePetal p3"></span>
              <span class="rosePetal p4"></span>
              <span class="rosePetal p5"></span>
              <span class="rosePetal p6"></span>
              <span class="rosePetal p7"></span>
              <span class="rosePetal p8"></span>
              <span class="rosePetal p9"></span>
              <span class="rosePetal p10"></span>
            </div>

            <div class="reeds" aria-hidden="true">
              <span class="reed r1"></span>
              <span class="reed r2"></span>
              <span class="reed r3"></span>
              <span class="reed r4"></span>
              <span class="reed r5"></span>
              <span class="reed r6"></span>
              <span class="reed r7"></span>
              <span class="reed r8"></span>
            </div>

            <div class="petalFallLayer" id="petalFallLayer" aria-hidden="true"></div>
          </div>

          <div class="flowerStory glass" aria-live="polite">
            <div class="flowerLineWrap">
              <span id="flowerText" class="flowerText"></span>
              <span class="flowerCursor" aria-hidden="true">|</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Scene 6: Gallery -->
      <section id="scene-gallery" class="scene" data-scene="gallery" aria-label="Gallery Foto">
        <div class="galleryShell" id="galleryShell">
          <div class="galleryOverlayText">
            <div class="galleryOverlayTitle">Klik foto untuk membuka Gambar</div>
          </div>

          <div class="galleryViewport" id="galleryViewport">
            <div class="galleryTrack" id="galleryTrack">
              <div class="rail" id="railA"></div>
              <div class="rail" id="railB"></div>
            </div>
          </div>

          <!-- Modal -->
          <div class="modalOverlay" id="modalOverlay" hidden>
            <button class="modalClose" id="modalClose" aria-label="Tutup popup">✕</button>
            <div class="modalInner" role="dialog" aria-modal="true" aria-label="Foto besar">
              <img id="modalImg" alt="Foto Valentine" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Backsound (ganti src ke audio milik Anda) -->
    <audio id="bgm" preload="auto" src="./img/music.m4a" style="display:none" aria-hidden="true"></audio>

    <script src="./app.js"></script>
  </body>
</html>
